name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # dev+serve only: the test suite runs against the committed ONNX
      # registry, so CI never needs torch or lightgbm.
      - run: pip install -e .[dev,serve]
      - run: ruff check src tests scripts
      - run: pytest

  train-tests:
    name: training path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # The lint-test job stays torch-free, which is the whole point of the
      # serving design. The training path still has to run somewhere, so it runs
      # here, on CPU wheels, against random weights and synthetic windows.
      - name: Install with the train extra (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[train,dev]"
      - name: Test the training and export path
        run: pytest tests/test_train_export.py -v

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t conformal-rul:ci .

      # The image installs the package with --no-deps on top of a pinned,
      # torch-free requirements set. That is easy to break from pyproject and the
      # breakage is invisible until someone looks at a 2 GB image.
      - name: Assert the image is torch-free
        run: |
          if docker run --rm conformal-rul:ci python -c "import torch" 2>/dev/null; then
            echo "::error::torch reached the serving image" && exit 1
          fi
          echo "confirmed: no torch in the serving image"
          docker image inspect conformal-rul:ci --format 'image size: {{.Size}} bytes'

      - name: smoke test the container
        run: |
          docker run -d --name smoke -p 8000:8000 conformal-rul:ci
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/health && break
            sleep 1
          done
          python - <<'EOF'
          import json, urllib.request
          cycle = {f"setting_{i}": 0.0 for i in (1, 2, 3)}
          cycle |= {f"s_{i:02d}": 0.5 for i in range(1, 22)}
          body = json.dumps({"subset": "FD001", "cycles": [cycle] * 35}).encode()
          req = urllib.request.Request(
              "http://localhost:8000/predict", body, {"Content-Type": "application/json"}
          )
          out = json.load(urllib.request.urlopen(req))
          assert 0 <= out["rul_cycles"] <= 125, out
          assert out["interval"]["lower"] <= out["interval"]["upper"], out
          print("container predict OK:", out["rul_cycles"], out["interval"])
          EOF
          docker rm -f smoke
