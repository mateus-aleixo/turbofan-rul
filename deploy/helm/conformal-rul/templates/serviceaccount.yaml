{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "conformal-rul.serviceAccountName" . }}
  labels:
    {{- include "conformal-rul.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The service calls no Kubernetes API, so the pod mounts no token
# (automountServiceAccountToken is false on the pod spec). The account exists so
# that a cloud identity can be bound to it later, IRSA on EKS or Workload
# Identity on GKE, without touching the Deployment.
automountServiceAccountToken: false
{{- end }}
