[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "conformal-rul"
version = "0.1.0"
description = "Probabilistic remaining-useful-life prediction for turbofan engines: PyTorch sequence models with conformal prediction intervals, served on AWS Lambda."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mateus Aleixo", email = "mateusfilipealeixo@gmail.com" }]
keywords = ["remaining-useful-life", "conformal-prediction", "predictive-maintenance", "pytorch", "time-series"]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
train = [
    "torch>=2.2",
    "lightgbm>=4.3",
    "mlflow>=2.12",
    "matplotlib>=3.8",
    "onnx>=1.16",
]
serve = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "onnxruntime>=1.17",
    "mangum>=0.17",
    "pydantic>=2.6",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
